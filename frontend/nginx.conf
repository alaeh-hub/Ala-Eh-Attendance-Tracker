# Static file server for the built SPA (frontend/Dockerfile, runtime stage).
# Sits behind Caddy, which terminates TLS and sets the security headers and
# the Content-Security-Policy (deploy/Caddyfile). Listens on 8080 because
# the nginx-unprivileged image does not run as root.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    # Caddy compresses too, but an uncompressed hop is wasteful and this
    # keeps the container usable on its own.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/ttf font/otf;

    # Liveness probe for the container HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed file names under /assets: cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The API and Socket.IO are routed to the backend by Caddy. If a request
    # ever reaches nginx it is a routing mistake: answer 404 instead of
    # returning index.html with a 200 (which would confuse the API client).
    location ~ ^/(api|socket\.io)(/|$) {
        return 404;
    }

    # The entry document must always be revalidated so a deploy is picked up
    # on the next load (kiosks reload the page; hashed assets change names).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything else: real files (logo, mascots) or the SPA fallback for
    # client-side routes such as /kiosk or /records.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
